<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>东京决赛 · BST识别检查</title>
<style>
:root{font-family:system-ui,sans-serif;color:#203a31;background:#f7f9f5}body{max-width:1080px;margin:0 auto;padding:24px}h1{font-size:28px;margin:16px 0}p{line-height:1.7}a{color:#326448}button,select{font:inherit;border:1px solid #cad5c5;background:white;border-radius:9px;padding:10px;color:inherit;cursor:pointer}#stats{display:flex;gap:12px;flex-wrap:wrap}.stat{flex:1;min-width:160px;padding:18px;background:#eaf0e5;border-radius:14px}.stat b{display:block;font-size:24px;margin-bottom:6px}video{width:100%;border-radius:12px;background:#152b22;max-height:520px;margin-top:14px}.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:18px 0}.table{overflow:auto;max-height:520px;background:white;border:1px solid #d5ddcf;border-radius:12px}table{border-collapse:collapse;width:100%;min-width:660px}td,th{padding:12px;text-align:left;border-bottom:1px solid #e5ebe0}th{position:sticky;top:0;background:#edf2e9}tr.active{background:#eef5e8}.muted{color:#64766a}.warning{color:#8b5b25}.card{background:white;border:1px solid #d5ddcf;padding:18px;border-radius:12px;margin:16px 0}#error{color:#9c342e}.selected{font-size:20px;font-weight:600}
@media(max-width:760px){table{min-width:0}td,th{padding:8px;font-size:13px}td button{padding:6px}.selected{font-size:18px}}
</style><body><a href="/">返回上传与对话</a><h1>东京决赛 · 原版 BST 识别检查</h1><p>谌龙对安赛龙。先看开局两段，共43.5秒；完整官方录像已保存在本机。</p><div id="stats"></div><p class="muted">原版 BST-0 权重；使用当前系统的姿态、球轨迹和击球提取。球种与击球时刻尚未逐拍人工核对，模型分数不代表准确率。</p><div class="bar"><label>录像 <select id="match"></select></label><button id="replay">重播所选片段</button><a href="https://www.youtube.com/watch?v=uIj03RsGrJA" target="_blank" rel="noreferrer">官方完整录像</a></div><video id="video" controls playsinline preload="metadata"></video><div class="card"><div id="selected" class="selected"></div><p id="range" class="muted"></p><p id="quality"></p><details><summary>该片段的前五个模型建议</summary><p id="top5"></p></details></div><h2>逐拍候选</h2><p>点击“回看”查看前后动作；比较 BST 给出的技术是否合理。谌龙为近端白衣，安赛龙为远端红衣。</p><div class="table"><table><thead><tr><th>原片时间</th><th>候选球员</th><th>BST球种建议</th><th>模型分数</th><th>击球者核对</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><p id="error"></p><p class="muted">此页面只展示冻结预测，不保存球种标签、不训练模型。<a href="/api/tokyo-benchmark">下载结构化检查结果</a></p>
<script>
const $=id=>document.getElementById(id);let data,clip,current,stop;
const format=t=>`${Math.floor(t/60)}:${(t%60).toFixed(2).padStart(5,'0')}`;
function seek(){if(!current)return;const time=Math.max(0,current.start);if($('video').readyState>=1)$('video').currentTime=time;else $('video').addEventListener('loadedmetadata',()=>{$('video').currentTime=time},{once:true});stop=current.end}
function select(e){current=e;$('video').pause();seek();$('selected').textContent=`${e.player_name} · BST建议：${e.stroke_label}${e.target_agreement?'':`（BST判定击球者：${e.model_actor_name}）`}`;$('range').textContent=`官方原片 ${format(clip.source_offset_seconds+e.start)}–${format(clip.source_offset_seconds+e.end)}；候选击球位置 ${format(clip.source_offset_seconds+e.peak_time)}`;const q=e.input_quality;$('quality').textContent=`范围内双人姿态有输出：${(q.paired_player_fraction*100).toFixed(1)}%；球检测有输出：${(q.raw_shuttle_fraction*100).toFixed(1)}%。输出是否准确仍需看录像确认。`;$('top5').textContent=e.top5.map(x=>`${x.label} ${(x.softmax_score*100).toFixed(1)}%`).join('；');for(const r of $('rows').children)r.classList.toggle('active',r.dataset.id===e.id)}
function show(){clip=data.jobs[Number($('match').value)];current=null;$('video').src='/media/'+clip.video_id;$('rows').replaceChildren();for(const e of clip.events){const row=document.createElement('tr');row.dataset.id=e.id;for(const value of [format(clip.source_offset_seconds+e.peak_time),e.player_name,e.stroke_label,`${(e.score*100).toFixed(1)}%`,e.target_agreement?'一致（待核对）':`有分歧：BST判为${e.model_actor_name}`]){const td=document.createElement('td');td.textContent=value;row.append(td)}if(!e.target_agreement)row.className='warning';const td=document.createElement('td'),b=document.createElement('button');b.textContent='回看';b.addEventListener('click',()=>{select(e);$('video').play().catch(()=>{})});td.append(b);row.append(td);$('rows').append(row)}if(clip.events.length)select(clip.events[0])}
$('match').addEventListener('change',show);$('replay').addEventListener('click',()=>{seek();$('video').play().catch(()=>{})});$('video').addEventListener('timeupdate',()=>{if(!$('video').paused&&stop!==undefined&&$('video').currentTime>=stop)$('video').pause()});
(async()=>{try{const res=await fetch('/api/tokyo-benchmark',{cache:'no-store'});data=await res.json();if(!res.ok)throw Error(data.error);for(const [name,value] of [['已处理录像',`${data.jobs.length}段`],['击球候选',data.candidate_count],['谌龙候选',data.player_counts.near||0],['安赛龙候选',data.player_counts.far||0]]){const box=document.createElement('div');box.className='stat';const num=document.createElement('b');num.textContent=value;box.append(num,document.createTextNode(name));$('stats').append(box)}data.jobs.forEach((j,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`开局片段${i+1} · 原片 ${format(j.source_offset_seconds)}–${format(j.source_end_seconds)}`;$('match').append(o)});show()}catch(e){$('error').textContent=e.message}})();
</script></body></html>
