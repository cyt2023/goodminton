<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>本轮动作候选与对照</title><style>
:root{color-scheme:light;--ink:#213d32;--muted:#63786d;--line:#d6dfd2;--pale:#edf2e8}
*{box-sizing:border-box}body{margin:0;background:#fafbf7;color:var(--ink);font:16px/1.6 system-ui,-apple-system,sans-serif}main{max-width:1120px;margin:auto;padding:28px 24px 70px}a{color:var(--ink)}h1{font-size:29px;margin:14px 0 8px}h2{font-size:20px}p{margin:8px 0}.muted{color:var(--muted)}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.stat{background:var(--pale);border-radius:16px;padding:12px 20px}.stat b{display:block;font-size:25px}.players{display:grid;grid-template-columns:1fr 1fr;gap:20px}video{width:100%;background:#183226;border-radius:14px;aspect-ratio:16/9}#referencePanel[hidden]{display:none}.players.single{grid-template-columns:1fr}button,select{font:inherit;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);padding:9px 14px;cursor:pointer}button:hover{background:var(--pale)}button.active{outline:2px solid #889e7e}button:focus-visible,select:focus-visible{outline:3px solid #628563;outline-offset:3px}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0 15px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.clip{text-align:left;padding:10px;background:white}.clip img{display:block;width:100%;height:135px;object-fit:contain;background:#21372c;border-radius:9px}.clip span{display:block;padding:7px 3px 2px}.clip small{display:block;color:var(--muted);padding:0 3px 5px}details{margin-top:26px;padding:18px;border:1px solid var(--line);border-radius:14px}summary{cursor:pointer;font-weight:600}#sequence{width:100%;margin-top:12px;border-radius:10px}#sync{width:100%}#comparison{padding:14px 0}#error{color:#935331}table{border-collapse:collapse;width:100%;margin-top:12px}td,th{text-align:left;padding:9px 0;border-bottom:1px solid var(--line)}@media(max-width:700px){main{padding:20px 16px}.players{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.clip img{height:110px}h1{font-size:25px}}
</style></head><body><main>
<a href="/">返回上传与对话</a>
<a id="reviewLink" style="margin-left:20px">帮 AI 认准球种</a>
<a id="analysisLink" style="margin-left:20px">球与球拍 · 集成分析</a><h1>本轮动作候选与对照</h1>
<p class="muted">点击候选即可回看。动作标签尚未核对；对照片段来自这段个人录像，尚未被认定为正确示范。</p>
<p id="error" role="alert"></p><div class="stats" id="stats"></div>
<section id="viewer" hidden><div class="players single" id="players"><div><h2 id="selectedTitle">个人片段</h2><video id="personal" controls playsinline preload="metadata"></video></div><div id="referencePanel" hidden><h2>另一次同类动作 · 待核对</h2><video id="reference" controls playsinline preload="metadata"></video></div></div>
<div id="comparison"></div><div id="syncPanel" hidden><label for="sync">沿对应帧查看两次动作</label><input id="sync" type="range" min="0" max="1" value="0"><p id="syncLabel" class="muted"></p></div>
<details><summary>查看这次动作的连续画面</summary><img id="sequence" alt="候选动作连续画面与目标球员框"></details></section>
<div class="filters"><label>球员 <select id="side"><option value="all">两位</option><option value="near">候选球员 A</option><option value="far">候选球员 B</option></select></label><label>技术 <select id="technique"><option value="all">全部候选</option><option value="backhand" selected>疑似反手</option><option value="forehand">疑似正手</option><option value="smash">疑似杀球</option><option value="clear">疑似高远球</option><option value="net">疑似放网</option><option value="drop">疑似吊球</option><option value="lift">疑似挑球</option><option value="drive">疑似平抽球</option><option value="push">疑似推球</option><option value="net_kill">疑似扑球</option><option value="net_cross">疑似勾对角</option><option value="defense">疑似挡网（接杀）</option><option value="serve_short">疑似发网前球</option><option value="serve_long">疑似发后场球</option></select></label></div>
<p id="empty" class="muted"></p><div id="clips" class="grid"></div>
<details><summary>本轮运行记录</summary><p id="methodNote"></p><table><tbody id="methodRows"></tbody></table><p class="muted">数量与模型输出描述本次运行，不能用来计算准确率或召回率。参考对齐只是二维画面对应，不用于判定技术好坏。</p><a id="jsonLink">查看完整记录 JSON</a></details>
</main><script>
const $=id=>document.getElementById(id),job=new URLSearchParams(location.search).get('job');
$('analysisLink').href='/analysis?job='+encodeURIComponent(job||'');
$('reviewLink').href='/label-strokes?job='+encodeURIComponent(job||'');
let report,selectedId=null,activePath=[],personalEnd=null,referenceEnd=null;
const sideName=s=>s==='near'?'候选球员 A':'候选球员 B';
function render(){
 const side=$('side').value,tech=$('technique').value;
 const items=report.events.filter(e=>(side==='all'||e.player===side)&&(tech==='all'||(['backhand','forehand'].includes(tech)?e.swing_style===tech&&e.style_certainty==='likely':e.stroke_type===tech)));
 $('clips').replaceChildren();$('empty').textContent=items.length?'':'本轮没有可展示的这类候选，这不代表视频里没有这类动作。';
 for(const e of items){const b=document.createElement('button');b.type='button';b.className='clip'+(e.id===selectedId?' active':'');const im=document.createElement('img');im.src=e.thumbnail_url;im.alt=sideName(e.player)+'动作预览';im.loading='lazy';const title=document.createElement('span');title.textContent=sideName(e.player)+' · '+(e.swing_style==='backhand'?'疑似反手':e.swing_style==='forehand'?'疑似正手':'')+' '+e.stroke_label;const small=document.createElement('small');small.textContent=e.peak_time.toFixed(2)+' 秒 · 待核对';b.append(im,title,small);b.addEventListener('click',()=>select(e));$('clips').append(b)}
}
function seek(video,t){if(video.readyState>=1){video.currentTime=t}else{video.addEventListener('loadedmetadata',()=>{video.currentTime=t},{once:true})}}
function select(e){
 selectedId=e.id;render();$('viewer').hidden=false;$('selectedTitle').textContent=sideName(e.player)+' · '+e.stroke_label+'候选';$('sequence').src=e.sequence_url;
 const source='/media/'+report.source_video_id;if(!$('personal').src.endsWith(source))$('personal').src=source;
 $('personal').pause();personalEnd=Math.min(e.end,e.peak_time+.65);seek($('personal'),Math.max(e.start,e.peak_time-.65));
 $('reference').pause();$('referencePanel').hidden=true;$('players').classList.add('single');$('syncPanel').hidden=true;activePath=[];
 const references=report.alignments.results.find(r=>r.event_id===e.id)?.references||[];
 $('comparison').replaceChildren();
 if(!references.length){$('comparison').textContent='尚无满足本轮条件的个人对照片段。';return}
 const text=document.createElement('p');text.textContent='可与同一球员的另一次同类动作对照。两段的技术标签和教学适用性都尚未核对。';$('comparison').append(text);
 for(const ref of references){const b=document.createElement('button');b.textContent='对照 '+ref.reference_start.toFixed(2)+' 秒附近的动作';b.type='button';b.addEventListener('click',()=>{activePath=ref.path;$('referencePanel').hidden=false;$('players').classList.remove('single');$('reference').src=source;referenceEnd=ref.reference_end;$('sync').max=Math.max(0,activePath.length-1);$('sync').value=0;$('syncPanel').hidden=false;sync();});$('comparison').append(b)}
}
function sync(){const p=activePath[Number($('sync').value)];if(!p)return;$('personal').pause();$('reference').pause();seek($('personal'),p.personal_time);seek($('reference'),p.reference_time);$('syncLabel').textContent='个人 '+p.personal_time.toFixed(3)+' 秒 ↔ 对照 '+p.reference_time.toFixed(3)+' 秒。保留原始时间，不改变播放速度。'}
$('sync').addEventListener('input',sync);for(const id of ['side','technique'])$(id).addEventListener('change',render);
$('personal').addEventListener('timeupdate',()=>{if(!$('personal').paused&&personalEnd!==null&&$('personal').currentTime>=personalEnd)$('personal').pause()});$('reference').addEventListener('timeupdate',()=>{if(!$('reference').paused&&referenceEnd!==null&&$('reference').currentTime>=referenceEnd)$('reference').pause()});
(async()=>{try{if(!job||!/^[A-Za-z0-9_-]{1,80}$/.test(job))throw Error('请选择已完成分析的录像。');const response=await fetch('/api/specialist/'+encodeURIComponent(job),{cache:'no-store'});const data=await response.json();if(!response.ok)throw Error(data.error||'记录无法读取');report=data;const m=report.metrics;for(const [n,v] of [['击球候选',m.attempted_hit_candidates],['可展示动作候选',m.usable_stroke_candidates],['疑似反手',m.likely_style_counts.backhand||0],['已有个人对照',m.personal_events_with_alignment]]){const box=document.createElement('div');box.className='stat';const number=document.createElement('b');number.textContent=v;const label=document.createElement('span');label.textContent=n;box.append(number,label);$('stats').append(box)}$('methodNote').textContent='本轮使用逐帧 RTMPose、TrackNetV3、BST-0 和视觉模型的正反手候选判断；对照采用阶段约束的二维 DTW。完整版 BST 的场地坐标输入尚未启用。';for(const [n,v] of [['原视频帧数',m.original_frames],['球检测输出帧数',m.raw_ball_detected_frames],['轨迹补全请求帧数',m.inpaint_requested_frames],['球轨迹耗时',m.trajectory_runtime_seconds.toFixed(1)+' 秒'],['逐帧姿态耗时',m.pose_runtime_seconds.toFixed(1)+' 秒'],['累计逐片分类耗时',(report.methods.runtime_seconds_events_cumulative ?? report.methods.runtime_seconds_this_invocation).toFixed(1)+' 秒'],['处理错误',Object.values(m.error_counts).reduce((a,b)=>a+b,0)],['输入或目标不满足显示条件',m.withheld_candidates]]){const row=document.createElement('tr');for(const value of [n,v]){const cell=document.createElement('td');cell.textContent=value;row.append(cell)}$('methodRows').append(row)}$('jsonLink').href='/api/specialist/'+encodeURIComponent(job);render()}catch(e){$('error').textContent=e.message}})();
</script></body></html>
